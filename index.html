<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casamento JENG | Jênnifer & Guilherme</title>
  
  <!-- Fontes Elegantes do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #2b2b2b;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #3e3835;
    }

    /* Contêiner Proporção 9:16 */
    .mobile-frame {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 850px;
      background: #f4eee3 url('fundo.jpg') no-repeat center center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    @media (max-width: 480px) {
      .mobile-frame {
        max-height: 100vh;
        border-radius: 0;
      }
    }

    .content {
      padding: 95px 24px 85px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* Cabeçalho */
    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header .subtitle {
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #7d6e65;
    }

    .header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.3rem;
      font-weight: 600;
      color: #433228;
      margin: 4px 0 2px;
      letter-spacing: 1px;
    }

    .header .names {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      font-style: italic;
      color: #63544c;
    }

    /* Cartão do Formulário */
    .form-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      border-radius: 16px;
      padding: 20px 18px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      color: #554841;
    }

    input, select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d4c8be;
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      background: #fff;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #8c7662;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      background-color: #6d5b4f;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(109, 91, 79, 0.3);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    /* Modal / Painel Admin */
    .admin-link {
      text-align: center;
      margin-top: 15px;
    }

    .admin-link button {
      background: none;
      border: none;
      font-size: 0.7rem;
      color: #8c7e75;
      text-decoration: underline;
      cursor: pointer;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-content {
      background: #fff;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .modal-header h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .table-container {
      overflow-y: auto;
      flex: 1;
      margin-bottom: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
    }

    th, td {
      padding: 8px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #f7f4ef;
      font-weight: 600;
      position: sticky;
      top: 0;
    }

    .btn-export {
      background-color: #3b6e4c;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
    }

    .success-msg {
      display: none;
      text-align: center;
      padding: 20px 10px;
    }
    
    .success-msg h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      color: #433228;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <div class="content">
      
      <!-- Cabeçalho -->
      <header class="header">
        <span class="subtitle">Confirmação de Presença</span>
        <h1>Casamento JENG</h1>
        <div class="names">Jênnifer &amp; Guilherme</div>
      </header>

      <!-- Formulário RSVP -->
      <div class="form-card" id="cardFormulario">
        <form id="rsvpForm">
          <div class="form-group">
            <label for="nome">Nome Completo *</label>
            <input type="text" id="nome" required placeholder="Seu nome">
          </div>

          <div class="form-group">
            <label for="whatsapp">WhatsApp *</label>
            <input type="tel" id="whatsapp" required placeholder="(00) 00000-0000">
          </div>

          <div class="form-group">
            <label for="status">Você irá comparecer? *</label>
            <select id="status" required>
              <option value="" disabled selected>Selecione uma opção</option>
              <option value="Sim, com certeza!">Sim, com certeza!</option>
              <option value="Infelizmente não poderei">Infelizmente não poderei ir</option>
            </select>
          </div>

          <div class="form-group">
            <label for="acompanhantes">Nº de Acompanhantes (com você)</label>
            <select id="acompanhantes">
              <option value="1 (Apenas eu)">1 (Apenas eu)</option>
              <option value="2 pessoas">2 pessoas</option>
              <option value="3 pessoas">3 pessoas</option>
              <option value="4+ pessoas">4 ou mais pessoas</option>
            </select>
          </div>

          <div class="form-group">
            <label for="restricao">Restrição Alimentar ou Observação</label>
            <input type="text" id="restricao" placeholder="Ex: vegetariano, alergia a glúten...">
          </div>

          <div class="form-group">
            <label for="recado">Deixe um recado aos noivos</label>
            <textarea id="recado" rows="2" placeholder="Uma mensagem de carinho..."></textarea>
          </div>

          <button type="submit" class="btn-submit">Confirmar</button>
        </form>

        <div class="success-msg" id="msgSucesso">
          <h3>Obrigado!</h3>
          <p>Sua resposta foi registrada com sucesso.</p>
        </div>
      </div>

      <!-- Acesso Admin -->
      <div class="admin-link">
        <button onclick="acessarAdmin()">Acesso Administrativo</button>
      </div>

    </div>
  </div>

  <!-- Modal Admin -->
  <div class="modal" id="adminModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Confirmados (<span id="totalRespostas">0</span>)</h2>
        <button class="close-btn" onclick="fecharAdmin()">&times;</button>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Status</th>
              <th>Pessoas</th>
              <th>WhatsApp</th>
              <th>Restrição</th>
              <th>Recado</th>
            </tr>
          </thead>
          <tbody id="listaRespostas">
            <!-- Dados inseridos via JS -->
          </tbody>
        </table>
      </div>

      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <button class="btn-export" onclick="exportarCSV()">Baixar Planilha (CSV)</button>
        <button class="btn-export" style="background-color: #8c4a4a;" onclick="limparDados()">Limpar Tudo</button>
      </div>
    </div>
  </div>

  <script>
    const SENHA_ADMIN = "jeng2026"; // Altere a senha aqui

    // Envio do formulário
    document.getElementById('rsvpForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const resposta = {
        dataHora: new Date().toLocaleString('pt-BR'),
        nome: document.getElementById('nome').value.trim(),
        whatsapp: document.getElementById('whatsapp').value.trim(),
        status: document.getElementById('status').value,
        acompanhantes: document.getElementById('acompanhantes').value,
        restricao: document.getElementById('restricao').value.trim() || 'Nenhuma',
        recado: document.getElementById('recado').value.trim() || '-'
      };

      const lista = JSON.parse(localStorage.getItem('rsvp_jeng') || '[]');
      lista.push(resposta);
      localStorage.setItem('rsvp_jeng', JSON.stringify(lista));

      document.getElementById('rsvpForm').style.display = 'none';
      document.getElementById('msgSucesso').style.display = 'block';
    });

    // Painel Admin
    function acessarAdmin() {
      const senha = prompt("Digite a senha de administrador:");
      if (senha === SENHA_ADMIN) {
        carregarTabela();
        document.getElementById('adminModal').style.display = 'flex';
      } else if (senha !== null) {
        alert("Senha incorreta!");
      }
    }

    function fecharAdmin() {
      document.getElementById('adminModal').style.display = 'none';
    }

    function carregarTabela() {
      const lista = JSON.parse(localStorage.getItem('rsvp_jeng') || '[]');
      const tbody = document.getElementById('listaRespostas');
      document.getElementById('totalRespostas').innerText = lista.length;
      tbody.innerHTML = '';

      if (lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Nenhuma confirmação ainda.</td></tr>';
        return;
      }

      lista.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${item.nome}</strong></td>
          <td>${item.status}</td>
          <td>${item.acompanhantes}</td>
          <td>${item.whatsapp}</td>
          <td>${item.restricao}</td>
          <td>${item.recado}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function exportarCSV() {
      const lista = JSON.parse(localStorage.getItem('rsvp_jeng') || '[]');
      if (lista.length === 0) return alert("Não há dados para exportar.");

      let csv = "\uFEFFData/Hora;Nome;WhatsApp;Status;Acompanhantes;Restrições;Recado\n";
      lista.forEach(r => {
        csv += `"${r.dataHora}";"${r.nome}";"${r.whatsapp}";"${r.status}";"${r.acompanhantes}";"${r.restricao}";"${r.recado}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'confirmados_casamento_jeng.csv';
      link.click();
    }

    function limparDados() {
      if (confirm("Tem certeza que deseja apagar todos os registros salvos?")) {
        localStorage.removeItem('rsvp_jeng');
        carregarTabela();
      }
    }
  </script>
</body>
</html>
