<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casamento JENG | Jênnifer & Guilherme</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #2b2b2b;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #3e3835;
    }

    .mobile-frame {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 850px;
      background: #f4eee3 url('fundo.jpg') no-repeat center center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    @media (max-width: 480px) {
      .mobile-frame {
        max-height: 100vh;
        border-radius: 0;
      }
    }

    .content {
      padding: 95px 24px 85px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header .subtitle {
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #7d6e65;
    }

    .header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.3rem;
      font-weight: 600;
      color: #433228;
      margin: 4px 0 2px;
      letter-spacing: 1px;
    }

    .header .names {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      font-style: italic;
      color: #63544c;
    }

    .form-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(6px);
      border-radius: 16px;
      padding: 20px 18px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      color: #554841;
      transition: color 0.2s;
    }

    input, select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d4c8be;
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      background: #fff;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #8c7662;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      background-color: #6d5b4f;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(109, 91, 79, 0.3);
      transition: opacity 0.2s;
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .success-msg {
      display: none;
      text-align: center;
      padding: 20px 10px;
    }
    
    .success-msg h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      color: #433228;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <div class="content">
      
      <header class="header">
        <span class="subtitle">Confirmação de Presença</span>
        <h1>Casamento JENG</h1>
        <div class="names">Jênnifer &amp; Guilherme</div>
      </header>

      <div class="form-card">
        <form id="rsvpForm">
          <div class="form-group">
            <label for="nome">Nome Completo *</label>
            <input type="text" id="nome" required placeholder="Seu nome completo">
          </div>

          <div class="form-group">
            <label for="whatsapp">WhatsApp *</label>
            <input type="tel" id="whatsapp" required placeholder="(00) 00000-0000">
          </div>

          <div class="form-group">
            <label for="status">Você irá comparecer? *</label>
            <select id="status" required>
              <option value="" disabled selected>Selecione uma opção</option>
              <option value="Sim, com certeza!">Sim, com certeza!</option>
              <option value="Infelizmente não poderei">Infelizmente não poderei ir</option>
            </select>
          </div>

          <div class="form-group" id="grupoAcompanhantes">
            <label for="acompanhantes">Nº de Acompanhantes (com você)</label>
            <select id="acompanhantes">
              <option value="1 (Apenas eu)">1 (Apenas eu)</option>
              <option value="2 pessoas">2 pessoas</option>
              <option value="3 pessoas">3 pessoas</option>
              <option value="4+ pessoas">4 ou mais pessoas</option>
            </select>
          </div>

          <!-- Campo dinâmico: Recado OU Acompanhantes -->
          <div class="form-group" id="grupoDinamico">
            <label for="campoDinamico" id="labelDinamico">Deixe um recado aos noivos</label>
            <textarea id="campoDinamico" rows="3" placeholder="Uma mensagem de carinho..."></textarea>
          </div>

          <button type="submit" id="btnSubmit" class="btn-submit">Confirmar</button>
        </form>

        <div class="success-msg" id="msgSucesso">
          <h3>Obrigado!</h3>
          <p>Sua confirmação foi enviada com sucesso aos noivos.</p>
        </div>
      </div>

    </div>
  </div>

  <script>
    const URL_DO_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbzoygexN5GiugZwbJgNsqvMXwI5jGrLWUcpgwk8pHRnIpDSGVRAO9ta-US9_MbdGzg-/exec";

    const selectAcomp = document.getElementById('acompanhantes');
    const labelDinamico = document.getElementById('labelDinamico');
    const inputDinamico = document.getElementById('campoDinamico');
    const selectStatus = document.getElementById('status');
    const grupoAcomp = document.getElementById('grupoAcompanhantes');

    // Alterna o campo dependendo da quantidade de pessoas
    selectAcomp.addEventListener('change', function() {
      if (this.value !== "1 (Apenas eu)") {
        labelDinamico.innerText = "Nome dos Acompanhantes *";
        inputDinamico.placeholder = "Ex: Nome e sobrenome de cada pessoa...";
        inputDinamico.required = true;
      } else {
        labelDinamico.innerText = "Deixe um recado aos noivos";
        inputDinamico.placeholder = "Uma mensagem de carinho...";
        inputDinamico.required = false;
      }
    });

    // Se a pessoa marcar que não vai, oculta a quantidade de acompanhantes
    selectStatus.addEventListener('change', function() {
      if (this.value === "Infelizmente não poderei") {
        grupoAcomp.style.display = "none";
        labelDinamico.innerText = "Deixe um recado aos noivos";
        inputDinamico.placeholder = "Deixe uma mensagem aos noivos...";
        inputDinamico.required = false;
      } else {
        grupoAcomp.style.display = "block";
        selectAcomp.dispatchEvent(new Event('change'));
      }
    });

    document.getElementById('rsvpForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = "Enviando...";

      const totalPessoas = selectStatus.value === "Infelizmente não poderei" ? "0" : selectAcomp.value;

      const dados = {
        dataHora: new Date().toLocaleString('pt-BR'),
        nome: document.getElementById('nome').value.trim(),
        whatsapp: document.getElementById('whatsapp').value.trim(),
        status: selectStatus.value,
        acompanhantes: totalPessoas,
        recado: inputDinamico.value.trim() || '-'
      };

      try {
        await fetch(URL_DO_GOOGLE_SCRIPT, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8',
          },
          body: JSON.stringify(dados)
        });

        document.getElementById('rsvpForm').style.display = 'none';
        document.getElementById('msgSucesso').style.display = 'block';
      } catch (err) {
        alert("Ocorreu um erro ao enviar. Por favor, tente novamente.");
        btn.disabled = false;
        btn.innerText = "Confirmar";
      }
    });
  </script>
</body>
</html>
